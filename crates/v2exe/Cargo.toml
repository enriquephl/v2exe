[package]
name = "v2exe"
version = "0.1.0"
description = "Terminal V2EX reader"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
unicode-width = "0.2.3"
v2ex-rs = { path = "../v2ex-rs" }

[dev-dependencies]
tempfile = "3.27.0"

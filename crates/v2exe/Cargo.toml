[package]
name = "v2exe"
version = "0.1.0"
description = "Terminal V2EX reader"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
toml = "1.2.1"
unicode-width = "0.2.3"
v2ex-rs = { path = "../v2ex-rs" }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
wiremock = "0.6.5"

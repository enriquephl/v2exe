[package]
name = "v2ex-rs"
version = "0.1.0"
description = "V2EX data layer: topics, replies and nodes from the public API and feeds"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.2"
chrono = { version = "0.4.45", features = ["serde"] }
feed-rs = "3.0.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "socks", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
wiremock = "0.6.5"
